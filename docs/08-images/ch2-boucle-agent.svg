<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="840" height="460" fill="#ffffff"/>
  <text x="420" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">La boucle de l'agent : le modèle propose, le harnais exécute</text>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Utilisateur -->
  <rect x="40" y="180" width="150" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Stagiaire</text>
  <text x="115" y="234" text-anchor="middle" font-size="11.5" fill="#0c4a6e">message = 1 tour</text>

  <!-- Harnais -->
  <rect x="250" y="90" width="330" height="300" rx="14" fill="#fff7ed" stroke="#f0883e" stroke-width="2.5"/>
  <text x="415" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Harnais (assistant IA)</text>

  <rect x="272" y="134" width="286" height="44" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="415" y="152" text-anchor="middle" font-size="12" fill="#7c2d12">1. Assemble le contexte : prompt système,</text>
  <text x="415" y="168" text-anchor="middle" font-size="12" fill="#7c2d12">AGENTS.md, historique, résultats d'outils</text>

  <rect x="272" y="188" width="286" height="44" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="415" y="206" text-anchor="middle" font-size="12" fill="#7c2d12">3. Vérifie l'appel d'outil (permissions),</text>
  <text x="415" y="222" text-anchor="middle" font-size="12" fill="#7c2d12">demande l'autorisation si nécessaire</text>

  <rect x="272" y="242" width="286" height="44" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="415" y="260" text-anchor="middle" font-size="12" fill="#7c2d12">4. Exécute l'outil (Read, Write, Bash,</text>
  <text x="415" y="276" text-anchor="middle" font-size="12" fill="#7c2d12">outil MCP) dans l'environnement</text>

  <rect x="272" y="296" width="286" height="44" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="415" y="314" text-anchor="middle" font-size="12" fill="#7c2d12">5. Réinjecte le résultat et boucle —</text>
  <text x="415" y="330" text-anchor="middle" font-size="12" fill="#7c2d12">ou affiche la réponse finale</text>

  <rect x="272" y="350" width="286" height="28" rx="8" fill="#ffedd5" stroke="#f0883e" stroke-width="1.2"/>
  <text x="415" y="369" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a3412">Gère sessions, mémoire, compactage</text>

  <!-- Modèle -->
  <rect x="650" y="150" width="160" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="730" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Modèle (LLM)</text>
  <text x="730" y="204" text-anchor="middle" font-size="11.5" fill="#312e81">2. Prédit les jetons :</text>
  <text x="730" y="222" text-anchor="middle" font-size="11.5" fill="#312e81">texte ou appel d'outil</text>
  <text x="730" y="248" text-anchor="middle" font-size="11.5" fill="#312e81">sans état —</text>
  <text x="730" y="266" text-anchor="middle" font-size="11.5" fill="#312e81">Ollama local ou API distante</text>

  <!-- Flèches -->
  <line x1="190" y1="210" x2="248" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="248" y1="280" x2="190" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <line x1="580" y1="156" x2="648" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="612" y="152" text-anchor="middle" font-size="11" fill="#475569">requête</text>
  <line x1="648" y1="255" x2="580" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="618" y="252" text-anchor="middle" font-size="11" fill="#475569">réponse</text>

  <text x="420" y="428" text-anchor="middle" font-size="12.5" fill="#4b5563">Un seul tour utilisateur = plusieurs requêtes au modèle (une par résultat d'outil réinjecté).</text>
  <text x="420" y="448" text-anchor="middle" font-size="12.5" fill="#4b5563">Le modèle n'exécute jamais rien lui-même : il émet du texte structuré que le harnais interprète.</text>
</svg>
