<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="780" height="420" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Budget mémoire d'un modèle en inférence</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Règle d'or : MÉMOIRE DISPONIBLE ≥ POIDS + CACHE KV + OVERHEAD</text>

  <!-- Barre mémoire disponible -->
  <rect x="60" y="90" width="660" height="46" rx="8" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="60" y="82" font-size="13" font-weight="bold" fill="#334155">RAM / VRAM disponible (ex. 24 Go)</text>

  <rect x="63" y="93" width="330" height="40" rx="6" fill="#f0883e"/>
  <text x="228" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Poids (fixes)</text>

  <rect x="397" y="93" width="200" height="40" rx="6" fill="#6366f1"/>
  <text x="497" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Cache KV (variable)</text>

  <rect x="601" y="93" width="60" height="40" rx="6" fill="#94a3b8"/>
  <text x="631" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Over-</text>
  <text x="631" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">head</text>

  <rect x="665" y="93" width="52" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="691" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">Marge</text>

  <!-- Bloc 1 : poids -->
  <rect x="60" y="170" width="210" height="180" rx="10" fill="#fff7ed" stroke="#f0883e" stroke-width="2"/>
  <text x="165" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a3412">1. Poids du modèle</text>
  <text x="75" y="222" font-size="12" fill="#7c2d12">= nb paramètres × octets/param</text>
  <text x="75" y="246" font-size="12" fill="#7c2d12">• FP16 : 2 octets/param (7B ≈ 14 Go)</text>
  <text x="75" y="268" font-size="12" fill="#7c2d12">• Q8 : ~1 octet (7B ≈ 7 Go)</text>
  <text x="75" y="290" font-size="12" fill="#7c2d12">• Q4_K_M : ~0,56 (7B ≈ 4 Go)</text>
  <text x="75" y="318" font-size="12" font-weight="bold" fill="#9a3412">Raccourci Q4 : Go ≈ B ÷ 2</text>
  <text x="75" y="338" font-size="12" fill="#7c2d12">Fixe une fois le modèle choisi.</text>

  <!-- Bloc 2 : cache KV -->
  <rect x="290" y="170" width="210" height="180" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="395" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3730a3">2. Cache KV</text>
  <text x="305" y="222" font-size="12" fill="#312e81">Grandit avec :</text>
  <text x="305" y="244" font-size="12" fill="#312e81">• la fenêtre de contexte</text>
  <text x="305" y="264" font-size="12" fill="#312e81">  (num_ctx) — linéaire</text>
  <text x="305" y="286" font-size="12" fill="#312e81">• le nb de séquences</text>
  <text x="305" y="306" font-size="12" fill="#312e81">  simultanées (batch)</text>
  <text x="305" y="332" font-size="12" font-weight="bold" fill="#3730a3">Un ctx 32k peut coûter</text>
  <text x="305" y="348" font-size="12" font-weight="bold" fill="#3730a3">plus que les poids !</text>

  <!-- Bloc 3 : overhead -->
  <rect x="520" y="170" width="200" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="196" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#334155">3. Overhead moteur</text>
  <text x="535" y="222" font-size="12" fill="#475569">Activations, buffers,</text>
  <text x="535" y="242" font-size="12" fill="#475569">fragmentation mémoire…</text>
  <text x="535" y="270" font-size="12" font-weight="bold" fill="#334155">Compter ~1 à 2 Go</text>
  <text x="535" y="298" font-size="12" fill="#475569">Si dépassement : offload</text>
  <text x="535" y="318" font-size="12" fill="#475569">partiel CPU (num_gpu),</text>
  <text x="535" y="338" font-size="12" fill="#475569">quantization KV (Q8/Q4).</text>

  <text x="390" y="395" text-anchor="middle" font-size="12.5" fill="#4b5563">En multi-utilisateur : VRAM ≈ poids + KV(1 séquence) × nb_utilisateurs + overhead — dimensionner d'abord nb_users × num_ctx.</text>
</svg>
