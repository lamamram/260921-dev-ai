<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">Hallucination : deux formes, deux diagnostics, deux remèdes opposés</text>

  <defs>
    <marker id="arrh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Symptôme -->
  <rect x="270" y="56" width="280" height="52" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="410" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">Sortie assurée mais erronée</text>
  <text x="410" y="96" text-anchor="middle" font-size="11.5" fill="#475569">« hallucination » — diagnostiquer avant de corriger</text>

  <!-- Question clé -->
  <rect x="235" y="136" width="350" height="48" rx="10" fill="#fff7ed" stroke="#f0883e" stroke-width="2"/>
  <text x="410" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">L'information correcte était-elle déjà</text>
  <text x="410" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">dans le contexte de l'agent ?</text>

  <line x1="410" y1="108" x2="410" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#arrh)"/>

  <!-- Branche NON -->
  <rect x="60" y="222" width="300" height="150" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="210" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#991b1b">NON → exactitude factuelle</text>
  <text x="80" y="274" font-size="11.5" fill="#7f1d1d">Cause : lacune de connaissance paramétrique</text>
  <text x="80" y="292" font-size="11.5" fill="#7f1d1d">(sujet rare, ou postérieur à la date limite</text>
  <text x="80" y="310" font-size="11.5" fill="#7f1d1d">des connaissances) — fonction inexistante,</text>
  <text x="80" y="328" font-size="11.5" fill="#7f1d1d">signature d'API erronée, citation fictive.</text>
  <text x="80" y="354" font-size="11.5" font-weight="bold" fill="#991b1b">Remède : AJOUTER du contexte pertinent</text>
  <text x="80" y="368" font-size="11.5" fill="#7f1d1d">(documentation, types, changelog de la version).</text>

  <!-- Branche OUI -->
  <rect x="460" y="222" width="300" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="610" y="248" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3730a3">OUI → fidélité</text>
  <text x="480" y="274" font-size="11.5" fill="#312e81">Cause : dégradation de l'attention — la</text>
  <text x="480" y="292" font-size="11.5" fill="#312e81">connaissance est présente mais noyée dans</text>
  <text x="480" y="310" font-size="11.5" fill="#312e81">un contexte saturé (zone stupide, session</text>
  <text x="480" y="328" font-size="11.5" fill="#312e81">trop longue, résultats d'outil périmés).</text>
  <text x="480" y="354" font-size="11.5" font-weight="bold" fill="#3730a3">Remède : RETIRER du contexte</text>
  <text x="480" y="368" font-size="11.5" fill="#312e81">(réinitialiser, compacter, recharger l'essentiel).</text>

  <line x1="330" y1="184" x2="230" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrh)"/>
  <line x1="490" y1="184" x2="590" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrh)"/>

  <text x="410" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4b5563">Le remède de l'une aggrave l'autre : coller davantage de documentation sur un problème de fidélité sature encore plus la fenêtre.</text>
  <text x="410" y="430" text-anchor="middle" font-size="12.5" fill="#4b5563">Sycophantie (acquiescement complaisant) : autre défaillance — formuler des prompts neutres, cacher sa préférence.</text>
</svg>
