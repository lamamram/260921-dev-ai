# Kit sandbox (Docker Sandboxes) : ajoute le SDK .NET à l'agent opencode
#
# Ce kit est un "mixin" appliqué par-dessus le template intégré `opencode`
# (basé sur Ubuntu). Il remplace l'ancienne approche par Dockerfile : au lieu
# de construire une image, on déclare ici les commandes d'installation
# exécutées une seule fois à la création du sandbox (microVM).
#
# Utilisation depuis .\opencode :
#   sbx run opencode --kit ./example/kit/
#
# Doc de référence : https://docs.docker.com/ai/sandboxes/customize/kits/

schemaVersion: "2"
kind: mixin
name: dotnet-sandbox
description: |
  Installe le SDK .NET (dotnet-install.sh) pour builder/exécuter le projet
  C# d'exemple (example/ECommerce.Api) dans le sandbox opencode.

setup:
  install:
    - command: |
        set -e
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ca-certificates curl
        curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
        chmod +x /tmp/dotnet-install.sh
        sudo /tmp/dotnet-install.sh --channel 10.0 --install-dir /opt/dotnet
        rm /tmp/dotnet-install.sh
        sudo ln -sf /opt/dotnet/dotnet /usr/local/bin/dotnet
  # TODO: faire fonctionner l'entrypoint
