environment:
  variables:
    DOTNET_ROOT: /opt/dotnet
    DOTNET_NOLOGO: "1"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    OLLAMA_HOST: "192.168.4.73"

# ports:
#   - container: 5000
#     name: "web"

agentInstructions:
  content: |
    Le SDK .NET est installé (vérifier avec `dotnet --version`).
    Le projet d'exercice se trouve dans `example/ECommerce.Api` (API minimale
    ASP.NET Core, catalogue/panier/commandes en mémoire, aucune base de données).

    Lancer l'API :
      cd example/ECommerce.Api && dotnet run --urls http://0.0.0.0:5000
